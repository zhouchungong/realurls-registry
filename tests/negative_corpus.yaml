      - {code: A9, data: {app: "Kagi Search", seller: "Kagi Ltd", seller_url: "https://kagi-app[.]example", age_days: 120, ratings: 4000, apps: [{app: "Kagi Search", seller: "Kagi Ltd", age_days: 120, ratings: 4000}]}}
      - {code: B4, data: {history_days: 380}}
      - {code: B5, data: {rank: 300000}}

  - id: appstore-established-app-of-another-company
    technique: 已锚定实体的域名上，证据是别家公司多年的应用（卖家 URL 恰好指向本域名，例如托管/代理站）
    facts: {domain: "hosted-brand[.]example", age_days: 3000, expected_wikidata: "Q116758847", anchor_sources: ["wikidata:Q116758847/P2037"], expected_names: ["Anthropic", "anthropics"]}
    evidence:
      - {code: A9, data: {app: "Other Notes App", seller: "Other Labs, Inc.", seller_url: "https://hosted-brand[.]example", age_days: 2000, ratings: 50000, apps: [{app: "Other Notes App", seller: "Other Labs, Inc.", age_days: 2000, ratings: 50000}]}}
      - {code: B4, data: {history_days: 2900}}
      - {code: B5, data: {rank: 20000}}

  - id: appstore-without-entity-anchor
    technique: 未锚定实体，仅凭一个多年应用 + 流量/历史佐证
    facts: {domain: "some-app-company[.]example", age_days: 3000}
    evidence:
      - {code: A9, data: {app: "Some App", seller: "Some App Company Inc.", seller_url: "https://some-app-company[.]example", age_days: 2000, ratings: 50000, apps: [{app: "Some App", seller: "Some App Company Inc.", age_days: 2000, ratings: 50000}]}}
      - {code: B4, data: {history_days: 2900}}
      - {code: B5, data: {rank: 20000}}

  - id: propagation-sponsor-site-backlink-unknown
    technique: 开源项目首页链接到赞助商（大站），两者恰好共享池化 NS；大站对采集器返回 403，反向链接未知（gh-01 批次的真实误报形态：anthropic.com / digitalocean.com / vmware.com 被"扩散"给受赞助项目）
    facts: {domain: "big-sponsor[.]example", age_days: 6000, expected_github_org: "python", anchor_sources: ["github-history:python/cpython"], expected_names: ["cpython", "python"]}
    evidence:
      - {code: A6, data: {from: "python[.]org", from_status: verified, first_party_link: true, structural_links: ["shared_ns"], san_count: 0, backlink: null}}
      - {code: B4, data: {history_days: 5800}}
      - {code: B5, data: {rank: 900}}

  - id: sponsor-domain-corporate-fingerprint-only
    technique: 开源项目首页链接到赞助商大站；大站有品牌保护注册商、长历史、高排名，但没有任何证据指名本实体（gh-01 批次真实误报：anthropic.com 判给 python，digitalocean.com 判给 gogs/phalcon/nodejs）
    facts: {domain: "big-sponsor[.]example", age_days: 6000, expected_github_org: "python", expected_wikidata: "Q599384", anchor_sources: ["wikidata:Q599384/P856"], expected_names: ["Python", "python"]}
    evidence:
      - {code: A1, data: {org: "sponsorcorp", is_verified: true}}
      - {code: A3, data: {registrar: "MarkMonitor Inc.", remaining_days: 2000, locks: ["clientDeleteProhibited", "clientTransferProhibited"]}}
      - {code: A6, data: {from: "python[.]org", from_status: verified, first_party_link: true, structural_links: [], san_count: 3, backlink: false}}
      - {code: B1, data: {qid: "Q116758847"}}
      - {code: B4, data: {history_days: 5800}}
      - {code: B5, data: {rank: 900}}

  - id: gov-tld-fingerprint-only
    technique: 政府域名（受限 TLD）被问到与它无关的实体名下：A7 + 历史 + 排名，没有任何证据指名实体
    facts: {domain: "some-agency.gov", age_days: 8000, expected_github_org: "python", expected_wikidata: "Q599384", anchor_sources: ["wikidata:Q599384/P856"], expected_names: ["Python"]}
    evidence:
      - {code: A7, data: {}}
      - {code: B4, data: {history_days: 7000}}
      - {code: B5, data: {rank: 5000}}

  - id: propagation-pooled-name-servers
    technique: 两个域名恰好都用 Namecheap 默认 NS（dns1/dns2.registrar-servers.com），互相链接；共享的是注册商，不是基础设施（gh-01：cmake.org ← kitware.com 的结构链接就是这种）
    facts: {domain: "partner[.]example", age_days: 4000, expected_github_org: "python", expected_wikidata: "Q599384", anchor_sources: ["wikidata:Q599384/P856"], expected_names: ["Python"]}
    evidence:
      - {code: A6, data: {from: "python[.]org", from_status: verified, first_party_link: true, structural_links: ["shared_ns"], shared_ns: ["dns1.registrar-servers.com", "dns2.registrar-servers.com"], san_count: 0, backlink: true}}
      - {code: B4, data: {history_days: 3900}}
      - {code: B5, data: {rank: 20000}}

  - id: propagation-into-a-domain-with-its-own-github-org
    technique: 紧密合作的两个组织（同一 Cloudflare 账号、互相链接），但候选域名被另一个 GitHub 组织声明为自己的站点（gh-01 真实误报：matrix.org 被判给 element-hq）
    facts: {domain: "matrix[.]org", age_days: 9000, expected_github_org: "element-hq", anchor_sources: ["github-history:element-hq/element-web"], expected_names: ["Element", "element-hq"]}
    evidence:
      - {code: A6, data: {from: "element[.]io", from_status: verified, first_party_link: true, structural_links: ["shared_ns"], shared_ns: ["derek.ns.cloudflare.com", "laura.ns.cloudflare.com"], san_count: 2, backlink: true}}
      - {code: A1, data: {org: "matrix-org", org_verified: false, blog: "https://www.matrix[.]org"}}
      - {code: B1, data: {qid: "Q22906785"}}
      - {code: B4, data: {history_days: 9900}}
      - {code: B5, data: {rank: 7500}}
