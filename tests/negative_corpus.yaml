# realurls 负样本回归语料
#
# 用途：precision >= 99.5% 是本项目的硬约束，而**没有负样本就测不出误报率**。
# 本文件中的每一条，跑过 policy.decide() 之后都**不允许**得到 verified。
#
# 重要说明
# --------
# 1. 本文件中的域名全部为**合成样例**，按真实仿冒手法的形态构造，不指控任何真实主体。
#    真实仿冒语料在 CI 中从公开钓鱼源即时拉取比对（见 §3.4「引用，不收录」），
#    **不落地、不入库、不随 dist/ 分发** —— 我们不镜像别人的指控，也不继承别人的误判。
# 2. 新增用例的唯一标准：它必须代表一类**我们的规则可能被骗过去**的手法。
#    每修一个误报 bug，就往这里加一条对应用例。
# 3. 域名统一写成 example[.]tld 形态，防止在文档渲染中被自动变成可点击链接。

cases:
  - id: homograph-cyrillic
    technique: IDN 同形异义字（西里尔 а 冒充拉丁 a）
    facts: {domain: "аnthropic[.]com", age_days: 9}
    evidence:
      - {code: B5, data: {rank: 940000}}
      - {code: B7, data: {flagged: false}}

  - id: typosquat-hyphen-insert
    technique: 连字符插入 + 新注册
    facts: {domain: "anthropic-claude[.]app", age_days: 11}
    evidence:
      - {code: B2, data: {}}
      - {code: B6, data: {}}
      - {code: B7, data: {flagged: false}}

  - id: fake-github-org-unverified
    technique: 注册同名 GitHub 组织，但未做域名验证
    facts: {domain: "cursor-ide[.]dev", age_days: 400}
    evidence:
      - {code: A1, data: {org_verified: false, blog: "https://cursor-ide[.]dev"}}
      - {code: B2, data: {}}
      - {code: B4, data: {history_days: 380}}

  - id: github-org-verified-but-other-domain
    technique: 真的有已验证 GitHub 组织，但 blog 指向的是另一个域名
    facts: {domain: "ollama-download[.]net", age_days: 900}
    evidence:
      - {code: A1, data: {org_verified: true, blog: "https://ollama.com"}}
      - {code: B4, data: {history_days: 800}}
      - {code: B5, data: {rank: 500000}}

  - id: cheap-registrar-posing-corporate
    technique: 伪装企业注册指纹，但注册商是零售商且续费只买 1 年
    facts: {domain: "supabase-cloud[.]io", age_days: 800}
    evidence:
      - {code: A3, data: {registrar: "NameCheap, Inc.", remaining_days: 300, locks: ["transfer"]}}
      - {code: B2, data: {}}
      - {code: B5, data: {rank: 700000}}

  - id: corporate-registrar-but-too-young
    technique: 用企业注册商注册的**新**域名（黑产偶尔为之，靠域龄拦住）
    facts: {domain: "n8n-enterprise[.]com", age_days: 120}
    evidence:
      - {code: A3, data: {registrar: "MarkMonitor Inc.", remaining_days: 1500, locks: ["delete", "transfer", "update"]}}
      - {code: B4, data: {history_days: 100}}
      - {code: B7, data: {flagged: false}}

  - id: propagation-from-unverified-source
    technique: 锚点扩散攻击 —— 从一个自身未 verified 的域名做一方声明
    facts: {domain: "lmstudio-app[.]org", age_days: 600}
    evidence:
      - {code: A6, data: {from: "lmstudio-mirror[.]org", from_status: "community", structural_links: ["shared_ns"]}}
      - {code: B2, data: {}}
      - {code: B5, data: {rank: 600000}}

  - id: propagation-without-structural-link
    technique: 已 verified 域名页面上出现的第三方外链（广告位、被入侵的友链）
    facts: {domain: "totally-unrelated-vendor[.]com", age_days: 1200}
    evidence:
      - {code: A6, data: {from: "anthropic.com", from_status: "verified", structural_links: []}}
      - {code: B4, data: {history_days: 1100}}
      - {code: B5, data: {rank: 300000}}

  - id: dv-cert-with-forged-org-claim
    technique: 声称证书带组织名，实为 DV 证书
    facts: {domain: "vercel-deploy[.]app", age_days: 500}
    evidence:
      - {code: A4, data: {validation_type: "DV", subject_org: "Vercel Inc."}}
      - {code: B2, data: {}}
      - {code: B5, data: {rank: 450000}}

  - id: fake-provenance-chain
    technique: 包里写了 provenance 字段但未通过 sigstore 验证
    facts: {domain: "huggingface-hub[.]co", age_days: 700}
    evidence:
      - {code: A2, data: {provenance_verified: false, chain_org_verified: true, chain_blog: "https://huggingface-hub[.]co"}}
      - {code: B2, data: {}}
      - {code: B3, data: {}}
      - {code: B4, data: {history_days: 650}}

  - id: provenance-chain-ends-elsewhere
    technique: provenance 真实，但链末端组织的 blog 是别的域名
    facts: {domain: "pytorch-install[.]com", age_days: 900}
    evidence:
      - {code: A2, data: {provenance_verified: true, chain_org_verified: true, chain_blog: "https://pytorch.org"}}
      - {code: B2, data: {}}
      - {code: B5, data: {rank: 400000}}

  - id: many-weak-corroborations-no-anchor
    technique: 堆砌大量弱佐证试图凑够门槛（佐证再多也不能替代锚点）
    facts: {domain: "openai-tools[.]net", age_days: 1000}
    evidence:
      - {code: B1, data: {}}
      - {code: B2, data: {}}
      - {code: B3, data: {}}
      - {code: B5, data: {rank: 200000}}
      - {code: B6, data: {}}
      - {code: B7, data: {flagged: false}}

  - id: expired-domain-resurrected
    technique: 抢注过期的旧域名 —— 域龄很老，但关键属性突变
    facts: {domain: "old-abandoned-tool[.]com", age_days: 4000, mutation_detected: true}
    evidence:
      - {code: A3, data: {registrar: "MarkMonitor Inc.", remaining_days: 1200, locks: ["delete", "transfer", "update"]}}
      - {code: B4, data: {history_days: 3800}}
      - {code: B5, data: {rank: 150000}}

  - id: flagged-but-otherwise-perfect
    technique: 证据齐全但已被安全情报标记（硬否决必须压过一切证据）
    facts: {domain: "compromised-vendor[.]com", age_days: 2000, gsb_flagged: true}
    evidence:
      - {code: A1, data: {org_verified: true, blog: "https://compromised-vendor[.]com"}}
      - {code: B1, data: {}}
      - {code: B4, data: {history_days: 1900}}
      - {code: B5, data: {rank: 90000}}

  # ---- 以下五条来自 REVIEW-RESULT.md（Fable 5.1 评审）----

  - id: attacker-controlled-verified-org
    technique: >
      评审 §0 的完整绕过链：二级市场买 2 年历史的 .io 域名（RDAP 404 → 域龄未知），
      自建 GitHub 组织、name 填 "Claude"、验证自己的域名（A1 证明的是控制权不是身份），
      建 Wikidata 条目指向它，买流量进 Tranco。修复前此链被判 verified 0.85。
    facts: {domain: "claude-desktop[.]io", age_days: null}
    evidence:
      - {code: A1, data: {org_verified: true, blog: "https://claude-desktop[.]io", org: "claude-desktop", org_name: "Claude"}}
      - {code: B1, data: {qid: "Q999999999", label: "Claude Desktop"}}
      - {code: B4, data: {history_days: 700}}
      - {code: B5, data: {rank: 850000}}

  - id: attacker-org-even-when-entity-anchored
    technique: 实体已锚定（canonical=anthropics），但 A1 来自另一个已验证的组织
    facts: {domain: "claude-desktop[.]io", age_days: 700, expected_github_org: anthropics, expected_wikidata: Q116758847}
    evidence:
      - {code: A1, data: {org_verified: true, blog: "https://claude-desktop[.]io", org: "claude-desktop"}}
      - {code: B1, data: {qid: "Q116758847"}}
      - {code: B4, data: {history_days: 700}}
      - {code: B5, data: {rank: 850000}}

  - id: rdap-unavailable-otherwise-complete
    technique: 域龄未知（ccTLD 无 RDAP、无 Wayback 下界）+ 证据齐全 → 必须 fail-closed
    facts: {domain: "legit-looking[.]so", age_days: null, expected_github_org: legitorg, expected_wikidata: Q123}
    evidence:
      - {code: A1, data: {org_verified: true, blog: "https://legit-looking[.]so", org: legitorg}}
      - {code: B1, data: {qid: "Q123"}}
      - {code: B4, data: {history_days: 100}}
      - {code: B5, data: {rank: 500000}}

  - id: retail-registrar-posing-as-corporate
    technique: Route53 注册 + 10 年预付 + 锁 —— 任何人 12 美元/年就能做到，不是企业指纹
    facts: {domain: "hashicorp-vault[.]net", age_days: 900}
    evidence:
      - {code: A3, data: {registrar: "Amazon Registrar, Inc.", remaining_days: 3500, locks: ["delete", "transfer", "update"]}}
      - {code: B4, data: {history_days: 850}}
      - {code: B5, data: {rank: 300000}}

  - id: propagation-structural-only-no-first-party-link
    technique: NS 碰撞成功（同一 Cloudflare NS 对），但锚点页面并没有链接到本域名
    facts: {domain: "anthropic-console[.]com", age_days: 800, expected_github_org: anthropics, expected_wikidata: Q116758847}
    evidence:
      - {code: A6, data: {from: "anthropic.com", from_status: "verified", first_party_link: false, structural_links: ["shared_ns"]}}
      - {code: B4, data: {history_days: 750}}
      - {code: B5, data: {rank: 400000}}

  - id: propagation-via-shared-cdn-certificate
    technique: 锚点链接到本域名（页脚外链），且证书 SAN 命中 —— 但那是一张 80 个 SAN 的 CDN 共享证书
    facts: {domain: "some-partner[.]com", age_days: 800, expected_github_org: anthropics, expected_wikidata: Q116758847}
    evidence:
      - {code: A6, data: {from: "anthropic.com", from_status: "verified", first_party_link: true, structural_links: ["cert_san"], san_count: 80}}
      - {code: B4, data: {history_days: 750}}
      - {code: B5, data: {rank: 400000}}

  # ---- 以下四条对应 A8 / 项目史锚定（PROJECT-PLAN §9 M2 决策）----

  - id: a8-fork-inherits-contributors
    technique: fork 会继承上游的全部贡献者与提交历史；项目史锚定必须排除 fork（repo_anchored=false）
    facts: {domain: "ollama-mirror[.]dev", age_days: 400}
    evidence:
      - {code: A8, data: {repo: "attacker/ollama", org: attacker, repo_anchored: false, homepage: "https://ollama-mirror[.]dev", backlink: true}}
      - {code: B4, data: {history_days: 380}}
      - {code: B5, data: {rank: 600000}}

  - id: a8-fresh-repo-with-pushed-history
    technique: 把上游历史 push 进新仓库（非 fork），贡献者看起来有几千，但 created_at 只有几个月
    facts: {domain: "pytorch-install[.]org", age_days: 400}
    evidence:
      - {code: A8, data: {repo: "attacker/pytorch", org: attacker, repo_anchored: false, homepage: "https://pytorch-install[.]org", backlink: true, contributors: 3000, age_days: 90}}
      - {code: B4, data: {history_days: 380}}
      - {code: B5, data: {rank: 600000}}

  - id: a8-homepage-points-to-platform
    technique: 真实案例——yt-dlp 的 homepage 字段填的是 discord.gg。平台域永远不是某项目的官网
    facts: {domain: discord.gg, age_days: 3000, expected_github_org: yt-dlp, anchor_sources: ["github-history:yt-dlp/yt-dlp"]}
    evidence:
      - {code: A8, data: {repo: "yt-dlp/yt-dlp", org: yt-dlp, repo_anchored: true, homepage: "https://discord.gg/H5MNcFW63r", backlink: false}}
      - {code: B4, data: {history_days: 2900}}
      - {code: B5, data: {rank: 200}}

  - id: a8-anchored-repo-but-wrong-org
    technique: 实体锚定到 ollama，攻击者用自己另一个（也满足门槛的老）仓库的 homepage 指向自己的域名
    facts: {domain: "ollama-cloud[.]io", age_days: 1200, expected_github_org: ollama, expected_wikidata: Q124636097}
    evidence:
      - {code: A8, data: {repo: "oldproject/oldrepo", org: oldproject, repo_anchored: true, homepage: "https://ollama-cloud[.]io", backlink: true}}
      - {code: B4, data: {history_days: 1100}}
      - {code: B5, data: {rank: 500000}}

  - id: a8-no-backlink
    technique: 锚定仓库 homepage 指向本域名，但本域名首页没有链回该组织（域名可能已易主）
    facts: {domain: "netdata-old[.]cloud", age_days: 2000, expected_github_org: netdata}
    evidence:
      - {code: A8, data: {repo: "netdata/netdata", org: netdata, repo_anchored: true, homepage: "https://netdata-old[.]cloud", backlink: false}}
      - {code: B4, data: {history_days: 1900}}
      - {code: B5, data: {rank: 300000}}

  - id: stale-b7-used-as-positive
    technique: 拿一条「Safe Browsing 已标记」的记录当正向佐证
    facts: {domain: "sketchy-mirror[.]site", age_days: 700}
    evidence:
      - {code: A3, data: {registrar: "MarkMonitor Inc.", remaining_days: 1200, locks: ["delete", "transfer"]}}
      - {code: B7, data: {flagged: true}}
      - {code: B5, data: {rank: 800000}}

  - id: propagation-third-party-ov-cert
    technique: 已 verified 域名的首页链接到一个大站（社交平台），该站自己的 OV 证书被当成本实体的锚点（openshift.com → instagram.com 的真实误报形态）
    facts: {domain: "social-platform[.]example", age_days: 6000, expected_github_org: "openshift", anchor_sources: ["github-history:openshift/origin"], expected_names: ["origin", "openshift"]}
    evidence:
      - {code: A6, data: {from: "openshift[.]com", from_status: verified, first_party_link: true, structural_links: [], san_count: 0}}
      - {code: A4, data: {validation_type: "OV", subject_org: "Meta Platforms, Inc.", issuer: "DigiCert Inc", san_count: 6}}
      - {code: B4, data: {history_days: 5800}}
      - {code: B5, data: {rank: 11}}

  - id: ov-cert-without-entity-anchor
    technique: 未锚定实体，仅凭一张真实的 OV 证书 + 流量/历史佐证
    facts: {domain: "some-company[.]example", age_days: 3000}
    evidence:
      - {code: A4, data: {validation_type: "OV", subject_org: "Some Company Ltd"}}
      - {code: B4, data: {history_days: 2900}}
      - {code: B5, data: {rank: 50000}}

  - id: propagation-third-party-no-backlink
    technique: 已 verified 站点首页链接到一个大站，两者恰好共享同一对池化 NS；大站自己有出站链接但从不链回锚点
    facts: {domain: "big-social-site[.]example", age_days: 6000, expected_github_org: "anthropics", expected_wikidata: "Q116758847", anchor_sources: ["wikidata:Q116758847/P2037"]}
    evidence:
      - {code: A6, data: {from: "anthropic.com", from_status: verified, first_party_link: true, structural_links: ["shared_ns"], san_count: 0, backlink: false}}
      - {code: B4, data: {history_days: 5800}}
      - {code: B5, data: {rank: 11}}

  - id: appstore-young-app-bought-ratings
    technique: 攻击者注册同名公司、上架一个新应用并刷评分，卖家 URL 指向仿冒域名
    facts: {domain: "kagi-app[.]example", age_days: 400, expected_wikidata: "Q123819301", anchor_sources: ["wikidata:Q123819301/P856"], expected_names: ["Kagi"]}
