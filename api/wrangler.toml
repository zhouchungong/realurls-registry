name = "realurls-api"
main = "src/index.mjs"
compatibility_date = "2026-09-01"

# Data lives in D1 (not in the Worker bundle). Load it with:
#   cd .. && python -m src.build && cd api && npx wrangler d1 execute realurls-registry --remote --file=../dist/registry.sql
# For local dev use --local instead of --remote.
routes = [
  { pattern = "api.realurls.org", zone_name = "realurls.org", custom_domain = true },
  { pattern = "realurls.org", zone_name = "realurls.org", custom_domain = true },
  { pattern = "www.realurls.org", zone_name = "realurls.org", custom_domain = true },
]

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "realurls-registry"
database_id = "6b61374a-4608-4ddb-a2dd-1bd7cc40b8ed"
