[project]
name = "realurls-registry"
version = "0.0.1"
description = "域名 ↔ 组织归属证据库的定案引擎与数据校验"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]
review = [
    "anthropic>=1.0,<2",   # src/review_ai.py; optional, the pipeline runs without it
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 本项目不依赖任何 pytest 插件；禁用自动加载可避免环境里其他包的插件干扰。
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 140   # English verdict strings are long; wrapping them hurts grep-ability
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Verdict strings must be whole sentences; wrapping them hurts grep-ability and the rendered pages.
"src/policy.py" = ["E501"]
"src/revalidate.py" = ["E501"]
