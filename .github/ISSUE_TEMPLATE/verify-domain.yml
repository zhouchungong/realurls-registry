name: Verify my domain (domain owner)
description: You control the domain. A bot replies with a DNS TXT record; publish it and the pipeline verifies you. No human in the loop.
title: "[verify] "
labels: ["owner-verification"]
body:
  - type: markdown
    attributes:
      value: |
        **For domain owners.** Within a minute a bot replies with a token. Publish it as a DNS TXT record at
        `_realurls.<your domain>`, comment `/verify`, and the domain is verified with the highest-weight evidence
        we have. No token needed if you verify the domain on your GitHub organization instead (Settings → Verified
        and approved domains): comment `/verify` and the bot reads that.

        Ownership only, never safety. The record must be in your own DNS zone; nothing else counts.

  - type: input
    id: domain
    attributes:
      label: Domain
      description: Registrable domain only, no scheme, no path
      placeholder: kagi.com
    validations: { required: true }

  - type: input
    id: org
    attributes:
      label: Organization
      description: The organization the domain belongs to, as you state it publicly
      placeholder: Kagi
    validations: { required: true }

  - type: input
    id: github
    attributes:
      label: GitHub organization (optional)
      placeholder: kagisearch

  - type: dropdown
    id: category
    attributes:
      label: Category (optional)
      options:
        - other
        - ai
        - developer-tools
        - saas
        - security
        - infrastructure
        - open-source
        - hardware
        - finance
        - government

  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: I control this domain's DNS zone and I am authorized to state which organization it belongs to.
          required: true
