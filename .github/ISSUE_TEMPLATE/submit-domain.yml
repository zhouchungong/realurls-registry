name: 收录线索
description: 告诉我们一个应该被收录的组织与它的官网。你只需提供线索，采证由我们完成。
title: "[收录] "
labels: ["lead", "needs-collection"]
body:
  - type: markdown
    attributes:
      value: |
        **你提交的是线索，不是数据。**

        不需要查 WHOIS、不需要截图、不需要写 YAML。机器人会自动采集全套证据并判定：
        - 证据充分 → 自动开 PR
        - 证据不足 → 自动关闭并告诉你缺哪一条

        如果你是**该域名的实际控制者**，请改用「域名所有者自证」模板，那条通道权重最高。

  - type: input
    id: org
    attributes:
      label: 组织 / 公司名
      placeholder: Anthropic
    validations: { required: true }

  - type: input
    id: domain
    attributes:
      label: 你认为的官网域名
      description: 只填域名，不要协议和路径
      placeholder: anthropic.com
    validations: { required: true }

  - type: dropdown
    id: category
    attributes:
      label: 类别
      description: 当前只收录 AI 与开发者工具，其他类别会排入后续阶段
      options:
        - ai
        - developer-tools
        - saas
        - security
        - infrastructure
        - open-source
        - other
    validations: { required: true }

  - type: textarea
    id: how
    attributes:
      label: 你是怎么知道这是官网的
      description: 随便写，一句话也行。这只用于帮机器人定位采证起点，不作为证据。
      placeholder: |
        比如：
        - GitHub 组织是 github.com/anthropics
        - npm 包 @anthropic-ai/sdk
        - 官方 X 账号 @AnthropicAI 上挂的链接
    validations: { required: true }

  - type: input
    id: aliases
    attributes:
      label: 用户可能会怎么搜它（可选）
      description: 产品名、俗称、缩写，逗号分隔
      placeholder: Claude, Claude Code, claude.ai

  - type: checkboxes
    id: ack
    attributes:
      label: 确认
      options:
        - label: 我明白 realurls 只判定域名归属，不判定网站的安全性或合法性
          required: true
        - label: 我没有与该组织的未披露利益关系（若有，请在上面说明 —— 有利益关系不影响收录，但必须公开）
          required: true
