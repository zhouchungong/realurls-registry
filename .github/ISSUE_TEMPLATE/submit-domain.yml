name: Submit a lead
description: An organization that should be listed, and its official site. Two fields; a bot does the rest.
title: "[lead] "
labels: ["lead"]
body:
  - type: markdown
    attributes:
      value: |
        **A lead, not data.** Name the organization and the domain; a bot collects the evidence, decides by the
        public rules, and replies here within minutes: merged with a live link, or the exact reason it fell short.

        If you **control the domain**, use "Verify my domain" instead: one DNS record carries the highest weight.

  - type: input
    id: org
    attributes:
      label: Organization / company
      placeholder: Anthropic
    validations: { required: true }

  - type: input
    id: domain
    attributes:
      label: Domain you believe is the official site
      description: Domain only, no scheme, no path
      placeholder: anthropic.com
    validations: { required: true }

  - type: input
    id: how
    attributes:
      label: How do you know this is the official site? (optional)
      description: A GitHub organization link or an npm package name helps the bot start in the right place. Not treated as evidence.
      placeholder: github.com/anthropics

  - type: input
    id: aliases
    attributes:
      label: Other names people search for (optional)
      placeholder: Claude, Claude Code

  - type: checkboxes
    id: ack
    attributes:
      label: Confirm
      options:
        - label: I understand Realurls judges domain ownership only, never whether a site is safe or lawful, and I have disclosed any interest in this organization above.
          required: true
