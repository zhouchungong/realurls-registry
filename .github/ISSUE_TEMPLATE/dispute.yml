name: Dispute / report an error
description: You think we got something wrong. This is the most serious class of issue we have — please tell us.
title: "[dispute] "
labels: ["dispute", "p0"]
body:
  - type: markdown
    attributes:
      value: |
        **The burden of proof is on us, not on you.**

        You do not have to prove we are wrong — a reasonable doubt is enough. Within **48 hours** the record is
        downgraded to `disputed` and positive API answers stop; we investigate after that.

        Security vulnerabilities (code / infrastructure): please do not open a public issue — email `security@realurls.org`.

  - type: input
    id: domain
    attributes:
      label: Domain in question
    validations: { required: true }

  - type: dropdown
    id: kind
    attributes:
      label: What kind of error?
      options:
        - A lookalike / unrelated domain was marked as official (most serious)
        - An official domain is attributed to the wrong organization
        - The domain changed hands or was shut down; the record is stale
        - I control this domain and disagree with the verdict
        - My domain was wrongly listed under non_affiliated
        - Other
    validations: { required: true }

  - type: textarea
    id: detail
    attributes:
      label: Details
      description: As much or as little as you have. Even "this looks wrong to me" gets investigated.
    validations: { required: true }

  - type: input
    id: contact
    attributes:
      label: Contact (optional)
      description: If you control the domain, we will contact you to complete a DNS TXT self-attestation
