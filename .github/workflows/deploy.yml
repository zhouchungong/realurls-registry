name: Deploy Worker (site + API)

# Redeploy on any data or code change: the dataset is loaded into D1 first, then the Worker code goes live.
# Bot merges dispatch this workflow explicitly (pushes made with GITHUB_TOKEN trigger nothing).
on:
  push:
    branches: [main]
    paths:
      - "entities/**"
      - "api/**"
      - "packages/**"
      - "src/build.py"
      - "schema/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: pip install -e "."

      - name: Validate data and build dist/ (the Worker's input)
        run: |
          python -m src.validate
          python -m src.build

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Query core tests
        run: node --test packages/core/resolve.test.mjs

      # Data first, code second: the Worker reads D1, so the dataset must be in place before the new
      # code goes live. registry.sql builds *_new tables and swaps them at the end (no half-loaded reads).
      - name: Load dataset into D1
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 2ba9b41856a8e2ff38d2c6630adb10f0
          workingDirectory: api
          command: d1 execute realurls-registry --remote --yes --file=../dist/registry.sql

      - name: Deploy
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 2ba9b41856a8e2ff38d2c6630adb10f0
          workingDirectory: api
          command: deploy

      - name: Live smoke test
        run: |
          set -e
          sleep 8
          curl -fsS https://api.realurls.org/healthz | grep -q '"ok": true'
          curl -fsS https://realurls.org/ | grep -qi "<title>realurls"
          ver=$(curl -fsS https://api.realurls.org/v1/manifest | python -c "import sys,json;print(json.load(sys.stdin)['dataset_version'])")
          echo "live dataset version: $ver (this commit ${GITHUB_SHA:0:12})"
