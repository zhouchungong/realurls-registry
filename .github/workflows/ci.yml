name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read


jobs:
  policy:
    name: Policy regression (incl. adversarial corpus)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Positive + adversarial regression
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: pytest tests -q
      - run: ruff check src tests

  data:
    name: Data validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: pip install -e "."
      - name: Schema, status recomputation, neutral wording, uniqueness
        run: python -m src.validate

  guard:
    name: Humans must not edit data directly
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Reject non-bot changes to entities/
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # SECURITY.md 1: the pipeline is the only legal writer of entities/. If data could be changed by a
          # pull request, this repository would be the highest-value target for laundering a phishing domain.
          changed=$(git diff --name-only "$BASE" "$HEAD" -- entities/)
          if [ -n "$changed" ] && [ "$AUTHOR" != "realurls-bot" ] && [ "$AUTHOR" != "github-actions[bot]" ]; then
            echo "::error::$AUTHOR changed entities/ directly:"
            echo "$changed"
            echo "Data is generated only by the pipeline. Submit a lead issue instead; see CONTRIBUTING.md."
            exit 1
          fi
          echo "ok: no direct human change to entities/"
