name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read


jobs:
  policy:
    name: Policy regression (incl. adversarial corpus)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Positive + adversarial regression
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: pytest tests -q
      - run: ruff check src tests

  data:
    name: Data validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: pip install -e "."
      - name: Schema, status recomputation, neutral wording, uniqueness
        run: python -m src.validate

  guard:
    name: Humans must not edit data directly
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Reject non-bot changes to entities/
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # SECURITY.md §1：entities/ 的唯一合法写入路径是流水线。
          # 如果数据可以被 PR 直接改，本仓库就是黑产洗白钓鱼站的最高价值目标。
          changed=$(git diff --name-only "$BASE" "$HEAD" -- entities/)
          if [ -n "$changed" ] && [ "$AUTHOR" != "realurls-bot" ] && [ "$AUTHOR" != "github-actions[bot]" ]; then
            echo "::error::$AUTHOR 试图直接修改 entities/："
            echo "$changed"
            echo "数据只能由流水线生成。请改为提交收录线索 Issue，见 CONTRIBUTING.md。"
            exit 1
          fi
          echo "✓ 未检测到人类对 entities/ 的直接改动"
