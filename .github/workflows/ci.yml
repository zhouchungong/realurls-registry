name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# TODO(上线前必做)：按 SECURITY.md T3，所有 action 必须 pin 到 commit SHA 而非浮动 tag。
#   gh api repos/actions/checkout/git/ref/tags/v4 --jq .object.sha
# 现阶段用 tag 是为了让骨架能跑起来，这是一笔明确记录在案的技术债。

jobs:
  policy:
    name: 定案引擎回归（含负样本）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: 正负样本回归
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: pytest tests -q
      - run: ruff check src tests

  data:
    name: 数据校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e "."
      - name: schema + 状态复算 + 中性措辞 + 唯一性
        run: python -m src.validate

  guard:
    name: 人类不得直接修改数据
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 拒绝非机器人对 entities/ 的改动
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # SECURITY.md §1：entities/ 的唯一合法写入路径是流水线。
          # 如果数据可以被 PR 直接改，本仓库就是黑产洗白钓鱼站的最高价值目标。
          changed=$(git diff --name-only "$BASE" "$HEAD" -- entities/)
          if [ -n "$changed" ] && [ "$AUTHOR" != "realurls-bot" ]; then
            echo "::error::$AUTHOR 试图直接修改 entities/："
            echo "$changed"
            echo "数据只能由流水线生成。请改为提交收录线索 Issue，见 CONTRIBUTING.md。"
            exit 1
          fi
          echo "✓ 未检测到人类对 entities/ 的直接改动"
