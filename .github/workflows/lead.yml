name: Community lead

# A "Submit a lead" issue names an organisation and a domain. The bot runs the same pipeline as every other
# entry point (src/examine.py), merges a verified record after the adversarial corpus and the AI review pass,
# and reports back on the issue with the rules' exact reasons otherwise. Humans never touch entities/.

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

jobs:
  lead:
    if: github.event.label.name == 'lead'
    concurrency:
      group: entities-writer
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev,review]"

      - name: Read the lead
        id: lead
        env:
          BODY: ${{ github.event.issue.body }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os, re
          body = os.environ["BODY"]
          def field(label):
              m = re.search(r"### " + re.escape(label) + r"\s*\n+(.*?)(?:\n###|\Z)", body, re.S)
              v = (m.group(1).strip() if m else "")
              return "" if v in ("", "_No response_") else v
          domain = field("Domain you believe is the official site").lower().strip()
          org = field("Organization / company").strip()
          how = field("How do you know this is the official site? (optional)")
          gh = re.search(r"github\.com/([A-Za-z0-9-]+)", how)
          print(f"domain={domain}")
          print(f"github_org={gh.group(1) if gh else ''}")
          print(f"org={org}")
          PY

      - name: Examine
        if: steps.lead.outputs.domain != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GSB_API_KEY: ${{ secrets.GSB_API_KEY }}
        run: |
          mkdir -p .cache
          args=(--domains "${{ steps.lead.outputs.domain }}" --json .cache/examine.json --sql .cache/examined.sql)
          [ -n "${{ steps.lead.outputs.github_org }}" ] && args+=(--github-org "${{ steps.lead.outputs.github_org }}")
          [ -n "${{ steps.lead.outputs.org }}" ] && args+=(--org-name "${{ steps.lead.outputs.org }}")
          python -m src.examine "${args[@]}"

      - name: Rules regression and AI review
        if: steps.lead.outputs.domain != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python -m src.validate
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 pytest tests -q
          set +e
          python -m src.review_ai --changed-since HEAD --json .cache/review.json
          echo "AI review exit: $?"
          python -m src.validate

      - name: Merge a verified record
        id: merge
        if: steps.lead.outputs.domain != ''
        run: |
          git config user.name  "realurls-bot"
          git config user.email "bot@realurls.org"
          git add entities/
          if git diff --cached --quiet; then echo "nothing verified"; exit 0; fi
          git commit -m "data(lead): ${{ steps.lead.outputs.domain }} (#${{ github.event.issue.number }})" -m "Community lead; rules regression and AI review passed in this run."
          for attempt in 1 2 3; do git pull --rebase origin main && git push && break; sleep $((attempt * 5)); done
          echo "merged=1" >> "$GITHUB_OUTPUT"

      - name: Deploy the new dataset
        if: steps.merge.outputs.merged == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run deploy.yml --ref main
          gh workflow run release.yml --ref main

      - name: Record a non-verified outcome in D1
        if: steps.lead.outputs.domain != '' && hashFiles('.cache/examined.sql') != ''
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 2ba9b41856a8e2ff38d2c6630adb10f0
          workingDirectory: api
          command: d1 execute realurls-registry --remote --yes --file=../.cache/examined.sql

      - name: Report back
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          DOMAIN: ${{ steps.lead.outputs.domain }}
          MERGED: ${{ steps.merge.outputs.merged }}
          GATE: ${{ steps.merge.outcome }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          issue, domain = os.environ["ISSUE"], os.environ["DOMAIN"]
          merged, gate = os.environ.get("MERGED") == "1", os.environ.get("GATE")
          if not domain:
              subprocess.run(["gh", "issue", "comment", issue, "--body", "I could not find a domain in this issue. Please edit the **Domain** field and re-add the `lead` label."], check=True)
              raise SystemExit(0)
          try:
              results = json.load(open(".cache/examine.json"))
          except FileNotFoundError:
              subprocess.run(["gh", "issue", "comment", issue, "--body", f"The pipeline run for **{domain}** failed before producing a result; a maintainer will look."], check=True)
              raise SystemExit(0)
          r = results[0]
          if r["status"] == "verified" and not merged:
              # The pipeline verified it but a gate (schema, corpus, AI review) or the merge failed: say so, never claim a merge.
              subprocess.run(["gh", "issue", "comment", issue, "--body",
                              f"**{domain}** reached `verified` in the pipeline, but a release gate did not pass in this run "
                              f"(merge step: {gate or 'skipped'}). Nothing was merged; a maintainer will look. The issue stays open."], check=True)
              raise SystemExit(0)
          if r["status"] == "verified":
              slug = r["entity_id"].split(":", 1)[-1]
              body = (f"**{domain}** reached `verified` and is merged. Live within minutes at https://realurls.org/e/{slug} "
                      f"and in the API; the record with every piece of evidence is `{r['file']}`. Thank you for the lead.")
              subprocess.run(["gh", "issue", "comment", issue, "--body", body], check=True)
              subprocess.run(["gh", "issue", "close", issue, "--reason", "completed"], check=False)
          else:
              why = "\n".join(f"- {x}" for x in (r.get("rejected") or [])[:6]) or "- (no evidence rejected)"
              body = (f"**{domain}** is `{r['status']}`, not verified. What the rules said:\n{why}\n\n"
                      f"Reasons: {'; '.join(r.get('reasons') or [])}\n\n"
                      "This is a limit of the evidence we can collect, not a judgement on the site. If you control the domain, "
                      "the fastest path is https://realurls.org/verify (one DNS TXT record, or a GitHub verified domain). "
                      "The domain stays in the queue and is re-examined as evidence changes.")
              subprocess.run(["gh", "issue", "comment", issue, "--body", body], check=True)
              subprocess.run(["gh", "issue", "edit", issue, "--add-label", "insufficient-evidence"], check=False)
          PY
