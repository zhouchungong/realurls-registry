name: Daily re-verification

on:
  schedule:
    - cron: "17 3 * * *"        # 03:17 UTC, off the top-of-the-hour peak
  workflow_dispatch:

permissions:
  contents: write
  actions: write       # gh workflow run deploy.yml / release.yml after a merge
  issues: write


jobs:
  revalidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: pip install -e "."

      - name: Re-verify every verified record
        id: reval
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GSB_API_KEY: ${{ secrets.GSB_API_KEY }}
        run: |
          set +e
          python -m src.revalidate --json .cache/revalidate.json 2> .cache/revalidate.log
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          cat .cache/revalidate.log

      # Second audit layer over records that changed today (upgrades included). Flag-only: it can move
      # verified -> review_required and sets a hold the next re-verification honours; it never promotes.
      - name: AI review of changed records
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          pip install -e ".[review]"
          set +e
          python -m src.review_ai --changed-since HEAD --json .cache/review.json
          echo "AI review exit: $?"

      - name: Validate the updated data
        run: python -m src.validate

      # The pipeline is the only legal writer of entities/: the bot commits, the CI guard admits only bot authors.
      - name: Commit changes
        run: |
          git config user.name  "realurls-bot"
          git config user.email "bot@realurls.org"
          git add entities/
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "chore(revalidate): $(date -u +%F) daily re-verification" \
                     -m "$(tail -1 .cache/revalidate.log)"
          git push
          # a push made with GITHUB_TOKEN does not trigger other workflows; deploy explicitly
          GH_TOKEN=${{ secrets.GITHUB_TOKEN }} gh workflow run deploy.yml --ref main
          GH_TOKEN=${{ secrets.GITHUB_TOKEN }} gh workflow run release.yml --ref main

      - name: Tell owners whose record was downgraded
        if: steps.reval.outputs.exit == '2'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json, subprocess, pathlib
          owners = {}
          p = pathlib.Path("seeds/owners.jsonl")
          if p.exists():
              for line in p.read_text(encoding="utf-8").splitlines():
                  if line.strip() and not line.startswith("#"):
                      r = json.loads(line)
                      if r.get("issue"): owners[r["domain"]] = r["issue"]
          for o in json.load(open(".cache/revalidate.json")):
              if o["action"] in ("downgraded", "review") and o["domain"] in owners:
                  body = (f"Daily re-verification changed **{o['domain']}**: {o['old_status']} → {o['new_status']} ({o['reason']}). "
                          "If the _realurls TXT record was removed or changed, restore it and comment `/verify`.")
                  subprocess.run(["gh", "issue", "comment", str(owners[o["domain"]]), "--body", body], check=False)
          PY

      - name: Open an issue on downgrades or review_required
        if: steps.reval.outputs.exit == '2'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const rows = JSON.parse(fs.readFileSync('.cache/revalidate.json', 'utf8'))
              .filter(o => o.action === 'downgraded' || o.action === 'review');
            const body = rows.map(o =>
              `- **${o.domain}** ${o.old_status} → ${o.new_status} (${o.action}): ${o.reason}` +
              (o.mutations?.length ? `\n  - mutations: ${o.mutations.join('; ')}` : '')
            ).join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `[re-verification] ${new Date().toISOString().slice(0,10)}: ${rows.length} record(s) need a look`,
              labels: ['revalidation', 'p1'],
              body: `Daily re-verification downgraded these records or moved them to review_required; the API no longer answers positively for them.\n\n${body}\n\n` +
                    `If this was a misjudgement, record it per CORRECTIONS.md and add an adversarial case; if the downgrade is correct, no action is needed.`,
            });
