name: 每日重验

on:
  schedule:
    - cron: "17 3 * * *"        # UTC 03:17，避开整点高峰
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# TODO(上线前必做)：SECURITY.md T3 —— 所有 action pin 到 commit SHA。

jobs:
  revalidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e "."

      - name: 重验全部 verified 记录
        id: reval
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GSB_API_KEY: ${{ secrets.GSB_API_KEY }}
        run: |
          set +e
          python -m src.revalidate --json .cache/revalidate.json 2> .cache/revalidate.log
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          cat .cache/revalidate.log

      - name: 校验改动后的数据
        run: python -m src.validate

      # 这是 entities/ 唯一合法的写入路径：由 bot 提交，CI guard 只放行这个作者。
      - name: 提交变更
        run: |
          git config user.name  "realurls-bot"
          git config user.email "bot@realurls.org"
          git add entities/
          git diff --cached --quiet && echo "无变更" && exit 0
          git commit -m "chore(revalidate): $(date -u +%F) 每日重验" \
                     -m "$(tail -1 .cache/revalidate.log)"
          git push

      - name: 降级或待人工 → 开 Issue
        if: steps.reval.outputs.exit == '2'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const rows = JSON.parse(fs.readFileSync('.cache/revalidate.json', 'utf8'))
              .filter(o => o.action === 'downgraded' || o.action === 'review');
            const body = rows.map(o =>
              `- **${o.domain}** ${o.old_status} → ${o.new_status}（${o.action}）：${o.reason}` +
              (o.mutations?.length ? `\n  - 突变：${o.mutations.join('；')}` : '')
            ).join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `[重验] ${new Date().toISOString().slice(0,10)}：${rows.length} 条需要人看`,
              labels: ['revalidation', 'p1'],
              body: `每日重验发现以下记录降级或进入 review_required，API 已停止对它们的肯定答复。\n\n${body}\n\n` +
                    `处理：核实后若确为误判，按 CORRECTIONS.md 流程记录并补负样本；若属实，无需操作。`,
            });
