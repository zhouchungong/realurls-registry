name: On-demand examination

# Domains people asked about and we had never examined (from the aggregate query counters) go through the
# same pipeline within minutes. verified → record written by build_entities, rules + AI review, merged to
# main (deploy follows); otherwise an `examined` row so the API says "examined on <date>" instead of
# "never looked". POLICY.md §3.5.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      domains:
        description: "Comma-separated domains to examine now (optional; default: the queue)"
        required: false
        type: string

permissions:
  contents: write
  actions: write       # gh workflow run deploy.yml / release.yml after a merge

concurrency:
  group: examine
  cancel-in-progress: false

jobs:
  examine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Fetch the queue
        id: queue
        run: |
          mkdir -p .cache
          if [ -n "${{ inputs.domains }}" ]; then
            echo "count=1" >> "$GITHUB_OUTPUT"
          else
            n=$(curl -fsS "https://api.realurls.org/v1/examine-queue" | python3 -c "import sys,json; print(len(json.load(sys.stdin).get('items', [])))")
            echo "queued: $n"
            echo "count=$n" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.queue.outputs.count != '0'
        with:
          python-version: "3.11"
      - if: steps.queue.outputs.count != '0'
        run: pip install -e ".[dev,review]"

      - name: Examine
        if: steps.queue.outputs.count != '0'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GSB_API_KEY: ${{ secrets.GSB_API_KEY }}
        run: |
          if [ -n "${{ inputs.domains }}" ]; then
            python -m src.examine --domains "${{ inputs.domains }}" --json .cache/examine.json --sql .cache/examined.sql
          else
            python -m src.examine --queue "https://api.realurls.org/v1/examine-queue" --max 20 --json .cache/examine.json --sql .cache/examined.sql
          fi

      - name: Rules regression and AI review on anything written
        if: hashFiles('.cache/examine.json') != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python -m src.validate
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 pytest tests -q
          set +e
          python -m src.review_ai --changed-since HEAD --json .cache/review.json
          echo "AI review exit: $?"
          python -m src.validate

      - name: Merge verified records
        id: merge
        if: hashFiles('.cache/examine.json') != ''
        run: |
          git config user.name  "realurls-bot"
          git config user.email "bot@realurls.org"
          git add entities/
          if git diff --cached --quiet; then echo "nothing verified"; exit 0; fi
          domains=$(python -c "import json;print(', '.join(r['domain'] for r in json.load(open('.cache/examine.json')) if r['status']=='verified'))")
          git commit -m "data(examine): $domains" -m "On-demand examination from the query queue; rules regression and AI review passed in this run."
          for attempt in 1 2 3; do git pull --rebase origin main && git push && break; sleep $((attempt * 5)); done
          echo "merged=1" >> "$GITHUB_OUTPUT"

      - name: Deploy the new dataset
        if: steps.merge.outputs.merged == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run deploy.yml --ref main
          gh workflow run release.yml --ref main


      - name: Close open issues answered by this merge
        if: steps.merge.outputs.merged == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json, subprocess
          results = json.load(open(".cache/examine.json"))
          for r in results:
              if r.get("status", "verified" if r.get("verified") else "") != "verified":
                  continue
              domain = r["domain"]
              slug = (r.get("entity_id") or "").split(":", 1)[-1]
              out = subprocess.run(["gh", "issue", "list", "--state", "open", "--search", f"{domain} in:title", "--json", "number,title,labels"],
                                   capture_output=True, text=True)
              for issue in json.loads(out.stdout or "[]"):
                  labels = {l["name"] for l in issue["labels"]}
                  if not labels & {"lead", "owner-verification", "insufficient-evidence", "awaiting-dns"} or domain not in issue["title"]:
                      continue
                  body = f"**{domain}** is now `verified`: https://realurls.org/e/{slug} (live within minutes). Closing this issue."
                  subprocess.run(["gh", "issue", "comment", str(issue["number"]), "--body", body], check=False)
                  subprocess.run(["gh", "issue", "close", str(issue["number"]), "--reason", "completed"], check=False)
          PY

      - name: Record non-verified outcomes in D1
        if: hashFiles('.cache/examined.sql') != ''
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 2ba9b41856a8e2ff38d2c6630adb10f0
          workingDirectory: api
          command: d1 execute realurls-registry --remote --yes --file=../.cache/examined.sql
