name: 构建并签名发布

on:
  push:
    branches: [main]
    paths: ["entities/**", "src/build.py", "schema/**"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write        # cosign keyless 签名需要 OIDC

# TODO(上线前必做)：SECURITY.md T3 —— 所有 action pin 到 commit SHA。

jobs:
  build-sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e "."

      - name: 校验 + 构建
        run: |
          python -m src.validate
          python -m src.build

      - name: 可复现性检查（同一输入必须得到相同字节）
        run: |
          cp dist/domains.json /tmp/a.json
          python -m src.build > /dev/null
          cmp dist/domains.json /tmp/a.json && echo "reproducible ✓"

      - uses: sigstore/cosign-installer@v3

      # keyless：用本 workflow 的 OIDC 身份签名，验证者能确认「这份数据是 realurls/registry 的
      # main 分支在 GitHub Actions 里生成的」，无需我们保管任何私钥（SECURITY.md T6）。
      - name: cosign 签名
        env:
          COSIGN_YES: "true"
        run: |
          cd dist
          for f in registry.json domains.json domains.txt registry.sqlite manifest.json; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
          ls -la

      - name: 发布为 GitHub Release（滚动 tag: latest）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ver=$(python -c "import json;print(json.load(open('dist/manifest.json'))['dataset_version'])")
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest dist/* \
            --title "dataset $ver" \
            --notes "$(python -c "import json;m=json.load(open('dist/manifest.json'));print(json.dumps(m['counts'],ensure_ascii=False,indent=2))")

验证签名：
\`\`\`
cosign verify-blob --bundle domains.json.sigstore.json \\
  --certificate-identity-regexp 'https://github.com/realurls/registry/' \\
  --certificate-oidc-issuer https://token.actions.githubusercontent.com \\
  domains.json
\`\`\`"
