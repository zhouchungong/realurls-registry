name: 构建并签名发布

on:
  push:
    branches: [main]
    paths: ["entities/**", "src/build.py", "schema/**"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write        # cosign keyless 签名需要 OIDC

# TODO(上线前必做)：SECURITY.md T3 —— 所有 action pin 到 commit SHA。

jobs:
  build-sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e "."

      - name: 校验 + 构建
        run: |
          python -m src.validate
          python -m src.build

      - name: 可复现性检查（同一输入必须得到相同字节）
        run: |
          cp dist/domains.json /tmp/a.json
          python -m src.build > /dev/null
          cmp dist/domains.json /tmp/a.json && echo "reproducible"

      - uses: sigstore/cosign-installer@v3

      # keyless：用本 workflow 的 OIDC 身份签名。验证者能确认「这份数据是本仓库 main 分支
      # 在 GitHub Actions 里生成的」，我们不保管任何私钥（SECURITY.md T6）。
      - name: cosign 签名
        env:
          COSIGN_YES: "true"
        run: |
          cd dist
          for f in registry.json domains.json entities.json domains.txt registry.sqlite manifest.json; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
          ls -la

      - name: 写 Release 说明
        run: |
          python - <<'PY'
          import json
          m = json.load(open("dist/manifest.json"))
          repo = "${{ github.repository }}"
          notes = f"""dataset `{m['dataset_version']}` · generated {m['generated_at']}

          | | |
          |---|---|
          | entities | {m['counts']['entities']} |
          | domains | {m['counts']['domains']} |
          | verified | {m['counts']['verified']} |

          Verify a file's signature (keyless, no key to distribute):

          ```
          cosign verify-blob --bundle domains.json.sigstore.json \\
            --certificate-identity-regexp 'https://github.com/{repo}/' \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \\
            domains.json
          ```

          Trust model: TRUST.md · License: CC BY-SA 4.0
          """
          open("/tmp/notes.md", "w").write("\n".join(l.strip() if l.strip().startswith(("|","```","cosign","--","domains.json")) else l.lstrip() for l in notes.splitlines()))
          PY

      - name: "发布为 GitHub Release（滚动 tag latest）"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ver=$(python -c "import json;print(json.load(open('dist/manifest.json'))['dataset_version'])")
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest dist/* --title "dataset $ver" --notes-file /tmp/notes.md
